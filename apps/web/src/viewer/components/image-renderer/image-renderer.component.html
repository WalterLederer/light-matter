@let imageUrl = displayUrl();
@let loading = isLoading();
@let location = imageLocation$ | async | default:defaultImageLocation;

<div class="loading-indicator" [class.visible]="loading && imageUrl === null">
  <ui-icon icon="arrowClockwise" size="x-large" />
</div>

<div #surface
     class="surface"
     [style.zoom]="location.pixelRatio"
     (click)="onSurfaceClick($event)"
     (pointermove)="onSplitPointerMove($event)"
     (pointerup)="onSplitPointerUp($event)"
     (pointercancel)="onSplitPointerUp($event)">

  @if (imageUrl !== null) {
    <img alt=""
         class="comparison-image sdr-image"
         [class.pannable]="location.zoom !== 'fit' && comparisonMode() !== 'dual-side-by-side'"
         [class.hidden-variant]="comparisonMode() === 'hdr'"
         [class.dual-side-by-side]="comparisonMode() === 'dual-side-by-side'"
         [width]="location.width"
         [height]="location.height"
         [style.left]="comparisonMode() === 'dual-side-by-side' ? '0%' : (location.x | px)"
         [style.top]="comparisonMode() === 'dual-side-by-side' ? '0%' : (location.y | px)"
         [style.transform]="comparisonMode() === 'dual-side-by-side' && location.zoom !== 'fit' ? 'scale(' + (location.zoom * 100 / location.fitZoom) + ')' : null"
         [style.transform-origin]="comparisonMode() === 'dual-side-by-side' ? 'center center' : null"
         [style.clip-path]="sdrClip()"
         [src]="imageUrl"
         (mousedown)="onMouseDown($event)">
    @if (comparisonMode() === 'side-by-side' || comparisonMode() === 'stacked') {
      <div class="comparison-split-handle"
           [class.vertical]="comparisonMode() === 'side-by-side'"
           [class.horizontal]="comparisonMode() === 'stacked'"
           [style.left]="comparisonMode() === 'side-by-side' ? (location.x + location.width * comparisonSplit() / 100 | px) : (location.x | px)"
           [style.top]="comparisonMode() === 'stacked' ? (location.y + location.height * comparisonSplit() / 100 | px) : (location.y | px)"
           [style.width]="comparisonMode() === 'side-by-side' ? '16px' : (location.width | px)"
           [style.height]="comparisonMode() === 'stacked' ? '16px' : (location.height | px)"
           (pointerdown)="onSplitPointerDown($event)"
           role="slider"
           tabindex="0"
           aria-label="SDR/HDR-Trennlinie"
           [attr.aria-valuenow]="comparisonSplit()"
           aria-valuemin="1"
           aria-valuemax="99">
        <span></span>
      </div>
    }

    <img alt=""
         class="comparison-image hdr-image"
         [class.hidden-variant]="comparisonMode() === 'sdr'"
         [class.pannable]="location.zoom !== 'fit' && comparisonMode() !== 'dual-side-by-side'"
         [class.dual-side-by-side]="comparisonMode() === 'dual-side-by-side'"
         [width]="location.width"
         [height]="location.height"
         [style.left]="comparisonMode() === 'dual-side-by-side' ? '50%' : (location.x | px)"
         [style.top]="comparisonMode() === 'dual-side-by-side' ? '0%' : (location.y | px)"
         [style.transform]="comparisonMode() === 'dual-side-by-side' && location.zoom !== 'fit' ? 'scale(' + (location.zoom * 100 / location.fitZoom) + ')' : null"
         [style.transform-origin]="comparisonMode() === 'dual-side-by-side' ? 'center center' : null"
         [style.clip-path]="hdrClip()"
         [src]="imageUrl"
         (mousedown)="onMouseDown($event)">
  }

</div>
