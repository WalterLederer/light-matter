<ui-dialog>
  <header>
    <ui-title>{{ options.title }}</ui-title>
  </header>
  <section>
    <ui-text [multiLine]="true">{{ options.description }}</ui-text>
  </section>
  <footer>
    <ui-action-button [cdkFocusInitial]="options.defaultAction !== 'cancel'"
                      [class.default-action]="options.defaultAction !== 'cancel'"
                      variant="primary"
                      (pressed)="dialogRef.close(true)">
      {{ options.confirmLabel ?? 'Yes' }}
    </ui-action-button>

    <ui-action-button [cdkFocusInitial]="options.defaultAction === 'cancel'"
                      [class.default-action]="options.defaultAction === 'cancel'"
                      (pressed)="dialogRef.close(false)">
      Cancel
    </ui-action-button>
  </footer>
</ui-dialog>
